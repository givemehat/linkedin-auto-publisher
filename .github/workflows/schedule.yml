name: Scheduled LinkedIn Post Publisher

on:
  schedule:
    # Runs at 04:30 UTC (10:00 AM IST) on Tuesday and Thursday every week
    - cron: '30 4 * * 2,4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab for testing

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish Next Queued Post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python publish.py

      - name: Commit and Push Updated posts.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          # Check if there are changes before committing
          if git diff --staged --quiet; then
            echo "No changes in posts.json (nothing published or all finished)."
          else
            git commit -m "chore(auto-publish): update posts.json with published status [skip ci]"
            git push origin HEAD
          fi
