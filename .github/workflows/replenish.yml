name: Auto-Replenish Buffer Queue

on:
  schedule:
    # Runs everyday at 04:15 UTC (09:45 AM IST), right after weekday 9:00 AM posts publish
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replenish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Buffer Replenisher
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 replenish_buffer.py

      - name: Commit & push if posts.json updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet || (git commit -m "chore(auto): replenish Buffer queue with next scheduled post" && git push)
